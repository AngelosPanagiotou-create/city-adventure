<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>City Adventure</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div id="app-container">
        
        <input type="file" accept="image/*" capture="environment" id="camera-input" class="hidden" onchange="savePhotoToInventory(event)">

        <header id="main-header" class="hidden">
            <div class="nav-icons">
                <div class="nav-item active" onclick="switchTab('map')">
                    <img src="https://img.icons8.com/color/96/map-marker--v1.png" alt="Map">
                    <span>Map</span>
                </div>
                <div class="nav-item" onclick="switchTab('player')">
                    <img src="https://img.icons8.com/color/96/test-account.png" alt="Player">
                    <span>Player</span>
                </div>
                <div class="nav-item" onclick="switchTab('inventory')">
                    <img src="https://img.icons8.com/color/96/backpack.png" alt="Items">
                    <span>Items</span>
                </div>
                <div class="nav-item" onclick="switchTab('badges')">
                    <img src="https://img.icons8.com/color/96/medal2.png" alt="Badges">
                    <span>Badges</span>
                </div>
            </div>
            <button id="menu-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></button>
        </header>

        <div id="sidebar" class="sidebar">
            <button class="close-btn" onclick="toggleSidebar()">×</button>
            <div class="sidebar-content">
                <h3>Menu</h3>
                <button onclick="location.reload()"><i class="fa-solid fa-house"></i> Αρχική</button>
                <button onclick="alert('City Adventure v1.0 - Dirfys Edition')"><i class="fa-solid fa-info-circle"></i> Πληροφορίες</button>
                <button onclick="window.close()"><i class="fa-solid fa-door-open"></i> Έξοδος</button>
            </div>
        </div>

        <div id="home-screen" class="screen active">
            <div class="splash-content">
                <div class="logo-placeholder">🗺️</div>
                <h1>City Adventure</h1>
                <p>Εξερεύνησε τη Στενή Δίρφυος</p>
                <button class="start-btn" onclick="startGame()">ΕΚΚΙΝΗΣΗ ΠΑΙΧΝΙΔΙΟΥ</button>
            </div>
        </div>

        <div id="game-screen" class="screen">
            
            <div id="map-pane">
                <div id="map"></div>
                <div id="dist-overlay">--- m</div>
            </div>

            <div id="content-pane">
                <div id="tab-map" class="tab-content active">
                    <p id="gps-status">Αναμονή για σήμα GPS...</p>
                    <div id="active-event" class="hidden"></div>
                </div>
                
                <div id="tab-player" class="tab-content">
                    <h3>Προφίλ Παίκτη</h3>
                    <p>Εξερευνητής της Δίρφυς</p>
                </div>

                <div id="tab-inventory" class="tab-content">
                    <h3>Σακίδιο Πλάτης 🎒</h3>
                    <div id="inventory-grid" class="inventory-grid">
                        </div>
                </div>

                <div id="tab-badges" class="tab-content">
                    <h3>Τα Μετάλλιά σου 🏆</h3>
                    <p>Συνολικοί Πόντοι: <b id="points-display" style="color:#deff9a; font-size: 24px;">0</b></p>
                    <div id="badges-grid" class="badges-grid">
                        </div>
                </div>
            </div>
        </div>

    </div>
    
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
            .then(() => console.log('Το Offline Mode και το PWA ενεργοποιήθηκαν!'));
        }
    </script>
</body>
</html>
